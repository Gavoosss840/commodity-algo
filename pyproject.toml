[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commodity-algo"
version = "0.1.0"
description = "Fundamental fair-value nowcasting and decision fiche for commodity futures (IB)"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "pyyaml>=6.0",
  "requests>=2.31",
  "xlsxwriter>=3.1",
  "openpyxl>=3.1",
  "python-dotenv>=1.0",
  "ib_async>=1.0",
  "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
commodity-algo = "commodity_algo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
